[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "park-matching"
version = "0.1.0"
description = "Find U.S. National Park System sites that fit what you like, using NPS data."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Park Matching team" }]
dependencies = [
    "pandas>=2.2",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
park_matching = ["data/*.csv", "data/*.md"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"test/*" = ["D"]

[tool.pytest.ini_options]
testpaths = ["test"]
